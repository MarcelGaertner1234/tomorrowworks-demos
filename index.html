<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TOMORROWWORKS — Design-Demos</title>
    <style>
      body {
        margin: 0;
        background: #f7f1e5;
        color: #2f261a;
        font-family: Baskerville, 'Iowan Old Style', Palatino, Georgia, serif;
        line-height: 1.7;
        display: grid;
        min-height: 100svh;
        place-items: center;
        text-align: center;
        padding: 2rem 1.2rem;
        box-sizing: border-box;
      }
      h1 {
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 1.4rem;
        margin: 0 0 0.4rem;
      }
      .hinweis {
        color: #6f6353;
        font-size: 0.92rem;
        max-width: 52ch;
        margin: 0.8rem auto 2rem;
      }
      a.demo {
        display: inline-block;
        border: 1px solid #2e4636;
        color: #2e4636;
        text-decoration: none;
        padding: 0.9rem 1.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.82rem;
      }
      a.demo:hover {
        background: #2e4636;
        color: #f7f1e5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tomorrowworks</h1>
      <p style="letter-spacing: 0.24em; text-transform: uppercase; font-size: 0.66rem; color: #816018">
        Design-Demos · Mosbach
      </p>
      <p class="hinweis">
        Unverbindliche Design-Entwürfe für Gespräche mit regionalen Betrieben — keine offiziellen
        Websites. Preise und Inhalte sind Beispiele.
      </p>
      <a class="demo" href="goldener-hirsch/">Hotel Goldener Hirsch — Entwurf ansehen</a>
    </main>
  </body>
</html>
